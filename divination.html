<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易道摇卦 - 易经占卜</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#0a0a1a; color:#e8d5b0; min-height:100vh; }
.back-btn { position:fixed; top:20px; left:20px; z-index:100; }
.back-btn a { display:inline-flex; align-items:center; gap:6px; color:#8a7a5a; text-decoration:none; font-size:14px; padding:8px 16px; border:1px solid rgba(201,168,76,0.3); border-radius:30px; transition:all 0.3s; }
.back-btn a:hover { border-color:#c9a84c; color:#c9a84c; }
.container { max-width:700px; margin:0 auto; padding:80px 20px 60px; text-align:center; }
.hero-icon { font-size:80px; margin-bottom:20px; }
.hero-title { font-size:36px; color:#c9a84c; letter-spacing:8px; margin-bottom:12px; }
.hero-sub { font-size:15px; color:#8a7a5a; margin-bottom:50px; line-height:2; }
.scene-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; margin-bottom:40px; }
.scene-btn { padding:18px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(201,168,76,0.2); border-radius:16px; color:#a0906a; cursor:pointer; font-size:15px; transition:all 0.3s; font-family:inherit; }
.scene-btn:hover { border-color:#c9a84c; color:#c9a84c; transform:translateY(-2px); }
.scene-btn.selected { border-color:#c9a84c; background:rgba(201,168,76,0.12); color:#c9a84c; box-shadow:0 4px 20px rgba(201,168,76,0.15); }
.question-box { margin-bottom:40px; }
.question-box input { width:100%; padding:18px 22px; background:rgba(255,255,255,0.05); border:1px solid rgba(201,168,76,0.2); border-radius:16px; color:#e8d5b0; font-size:15px; font-family:inherit; outline:none; transition:border-color 0.3s; }
.question-box input:focus { border-color:#c9a84c; }
.question-box input::placeholder { color:#5a4a3a; }
.ask-btn { display:inline-block; padding:20px 60px; background:linear-gradient(135deg,#c9a84c,#8a6420); color:#0a0a1a; font-size:20px; font-weight:bold; border:none; border-radius:50px; cursor:pointer; letter-spacing:4px; transition:all 0.3s; box-shadow:0 6px 30px rgba(201,168,76,0.3); font-family:inherit; }
.ask-btn:hover { transform:translateY(-3px); box-shadow:0 10px 40px rgba(201,168,76,0.5); }
.ask-btn:active { transform:translateY(0); }
.ask-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }
.tossing { display:none; }
.tossing.active { display:block; }
.coin-area { padding:60px 0 40px; }
.coins { display:flex; justify-content:center; gap:24px; margin-bottom:40px; }
.coin { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,#c9a84c,#8a6420); display:flex; align-items:center; justify-content:center; font-size:42px; box-shadow:0 8px 24px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2); border:3px solid rgba(232,201,106,0.4); transition:all 0.2s; }
.coin.flipping { animation:flipCoin 0.3s ease-in-out infinite; }
@keyframes flipCoin { 0%{transform:rotateY(0deg) scale(1);} 50%{transform:rotateY(180deg) scale(0.9);} 100%{transform:rotateY(360deg) scale(1);} }
.toss-text { font-size:17px; color:#a0906a; margin-bottom:30px; }
.toss-count { font-size:14px; color:#5a4a3a; margin-top:20px; }
.result { display:none; text-align:left; animation:fadeIn 0.6s ease; }
.result.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
.result-header { text-align:center; padding-bottom:30px; margin-bottom:30px; border-bottom:1px solid rgba(201,168,76,0.15); }
.result-question { font-size:14px; color:#8a7a5a; margin-bottom:8px; }
.result-scene-tag { display:inline-block; padding:4px 14px; background:rgba(201,168,76,0.1); border:1px solid rgba(201,168,76,0.3); border-radius:20px; font-size:12px; color:#c9a84c; margin-top:8px; }
.hexagram-display { text-align:center; padding:40px 0 30px; }
.hexagram-symbol { font-size:64px; letter-spacing:20px; margin-bottom:10px; }
.hexagram-name { font-size:52px; color:#c9a84c; font-weight:bold; letter-spacing:6px; margin-bottom:8px; }
.hexagram-meaning { font-size:16px; color:#8a7a5a; letter-spacing:2px; }
.divider { width:60px; height:2px; background:linear-gradient(90deg,transparent,#c9a84c,transparent); margin:0 auto 30px; }
.lines-area { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:30px; }
.line-row { display:flex; align-items:center; gap:14px; }
.line-num { font-size:12px; color:#4a3a2a; width:28px; text-align:right; }
.line-bar { width:140px; height:10px; border-radius:5px; }
.line-bar.yang { background:linear-gradient(90deg,#c9a84c,#e8c96a); box-shadow:0 0 8px rgba(201,168,76,0.3); }
.line-bar.yin { background:linear-gradient(90deg,#5a4a3a,#4a3a2a); position:relative; }
.line-bar.yin::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:50%; height:2px; background:#0a0a1a; border-radius:1px; }
.line-desc { font-size:12px; color:#5a4a3a; min-width:80px; text-align:left; }
.line-row.changing .line-desc { color:#c9a84c; font-weight:bold; }
.changing-note { background:rgba(201,168,76,0.06); border:1px solid rgba(201,168,76,0.2); border-radius:14px; padding:18px 20px; margin-bottom:20px; font-size:13px; color:#8a7a5a; line-height:2; }
.result-card { background:rgba(255,255,255,0.03); border:1px solid rgba(201,168,76,0.15); border-radius:20px; padding:28px 30px; margin-bottom:16px; }
.result-card h3 { font-size:15px; color:#c9a84c; margin-bottom:12px; letter-spacing:2px; }
.result-card p { font-size:14px; color:#a0906a; line-height:2; }
.advice-card { background:linear-gradient(135deg,rgba(201,168,76,0.08),rgba(138,100,32,0.04)); border:1px solid rgba(201,168,76,0.3); border-radius:20px; padding:28px 30px; margin-bottom:20px; text-align:center; }
.advice-card h3 { font-size:13px; color:#c9a84c; letter-spacing:3px; margin-bottom:14px; }
.advice-card p { font-size:15px; color:#e8d5b0; line-height:2; }
.again-btn { display:block; width:100%; padding:16px; background:transparent; border:1px solid rgba(201,168,76,0.3); color:#c9a84c; font-size:15px; border-radius:14px; cursor:pointer; letter-spacing:2px; transition:all 0.3s; font-family:inherit; margin-top:10px; }
.again-btn:hover { background:rgba(201,168,76,0.06); border-color:#c9a84c; }
.footer { text-align:center; padding:30px 20px; color:#3a2a1a; font-size:12px; border-top:1px solid rgba(201,168,76,0.08); margin-top:40px; }
.footer span { color:#c9a84c; }
@media(max-width:480px){
  .hexagram-symbol{font-size:48px;}
  .hexagram-name{font-size:36px;}
  .line-bar{width:100px;}
  .coin{width:64px;height:64px;font-size:32px;}
}
</style>
</head>
<body>
<div class="back-btn"><a href="index.html">← 返回首页</a></div>
<div class="container">
  <div id="page-start">
    <div class="hero-icon">☯</div>
    <div class="hero-title">易道摇卦</div>
    <div class="hero-sub">洗心静神，专心于你所问之事<br>心中默念问题，然后点击开始摇卦</div>
    <div class="question-box">
      <input type="text" id="question" placeholder="心中默念你的问题（可选）" maxlength="100">
    </div>
    <div style="margin-bottom:20px;">
      <div style="font-size:13px;color:#5a4a3a;margin-bottom:14px;letter-spacing:2px;">选择场景</div>
      <div class="scene-grid">
        <button class="scene-btn selected" data-scene="事业">📈 事业</button>
        <button class="scene-btn" data-scene="家庭">👨‍👩‍👧 家庭</button>
        <button class="scene-btn" data-scene="感情">💕 感情</button>
        <button class="scene-btn" data-scene="学业">📚 学业</button>
        <button class="scene-btn" data-scene="心理">🧠 心理</button>
      </div>
    </div>
    <button class="ask-btn" id="startBtn">☯ 开始摇卦</button>
  </div>
  <div id="page-tossing" class="tossing">
    <div class="coin-area">
      <div class="coins">
        <div class="coin" id="coin1">☰</div>
        <div class="coin" id="coin2">☰</div>
        <div class="coin" id="coin3">☰</div>

  <div id="page-result" class="result">

      <div class="result-question" id="resQuestion"></div>
      <div class="result-scene-tag" id="resSceneTag"></div>
    </div>
    <div class="hexagram-display">
      <div class="hexagram-symbol" id="hexSymbol"></div>
      <div class="hexagram-name" id="hexName"></div>
      <div class="hexagram-meaning" id="hexMeaning"></div>
    </div>
    <div class="divider"></div>
    <div class="lines-area" id="linesArea"></div>
    <div id="changingNote" class="changing-note"></div>
    <div class="result-card"><h3>【卦辞】</h3><p id="hexDesc"></p></div>
    <div class="advice-card"><h3>✨ 开运建议</h3><p id="hexAdvice"></p></div>
    <button class="again-btn" onclick="reset()">再摇一卦 ☯</button>
  </div>
</div>
<div class="footer">
  <p>© 2025 <span>易道 YIDAO</span> | Xinhui-631</p>

<script>

let currentScene = '事业';
let question = '';

document.querySelectorAll('.scene-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentScene = btn.dataset.scene;
  });
});

document.getElementById('startBtn').addEventListener('click', () => {
  question = document.getElementById('question').value.trim();
  startTossing();
});

/**
 * 传统三枚铜钱占卜法
 * 每枚铜钱：正面=2，反面=3
 * 总和：
 *   6 = 2+2+2（少阴）→ 阴爻（☷），不变
 *   7 = 2+2+3（少阳）→ 阳爻（☰），不变
 *   8 = 2+3+3（老阴）→ 阴爻（☷），变
 *   9 = 3+3+3（老阳）→ 阳爻（☰），变
 */
function coinToss() {
  const sum = (Math.random() < 0.5 ? 2 : 3) +
              (Math.random() < 0.5 ? 2 : 3) +
              (Math.random() < 0.5 ? 2 : 3);
  return sum;
}

function getLineResult(total) {
  if (total === 9) return { bar:'yang', text:'老阳（变爻）', change:true,  val:1 };
  if (total === 7) return { bar:'yang', text:'少阳',         change:false, val:1 };
  if (total === 8) return { bar:'yin',  text:'老阴（变爻）', change:true,  val:0 };
  if (total === 6) return { bar:'yin',  text:'少阴',         change:false, val:0 };
}

function startTossing() {
  document.getElementById('page-start').style.display = 'none';
  document.getElementById('page-tossing').classList.add('active');
  document.getElementById('startBtn').disabled = true;
  const lines = [];
  let round = 0;
  const coins = [
    document.getElementById('coin1'),
    document.getElementById('coin2'),
    document.getElementById('coin3')
  ];
  const flipSyms = ['☰','☷'];

  function tossRound() {
    round++;
    document.getElementById('tossCount').textContent = '第 ' + round + ' / 6 爻';
    // 启动翻转动画
    coins.forEach(c => c.classList.add('flipping'));
    let flips = 0;
    const iv = setInterval(() => {
      coins.forEach(c => c.textContent = flipSyms[Math.floor(Math.random() * 2)]);
      flips++;
      if (flips > 8) clearInterval(iv);
    }, 60);
    // 1秒后停止，显示结果
    setTimeout(() => {
      coins.forEach(c => c.classList.remove('flipping'));
      const total = coinToss();
      const r = getLineResult(total);
      lines.push(r);
      coins.forEach(c => c.textContent = r.bar === 'yang' ? '☰' : '☷');
      if (round < 6) {
        setTimeout(tossRound, 800);
      } else {
        document.getElementById('tossText').textContent = '卦象已定，正在解读...';
        setTimeout(() => showResult(lines), 1200);
      }
    }, 1000);
  }
  tossRound();
}

function showResult(lines) {
  document.getElementById('page-tossing').classList.remove('active');
  document.getElementById('page-result').classList.add('active');
  // 从下往上（第1爻为低位）计算卦号
  let gua = 0;
  for (let i = 5; i >= 0; i--) {
    gua = (gua << 1) | lines[i].val;
  }
  gua += 1; // 1~64
  const hex = HEX_DATA.find(h => h.n === gua) || HEX_DATA[0];
  const changed = lines.filter(l => l.change);

  document.getElementById('resQuestion').textContent = question ? '问题：' + question : '';
  document.getElementById('resSceneTag').textContent = currentScene + ' · 易道解读';
  document.getElementById('hexSymbol').textContent = hex.g + ' ' + hex.g;
  document.getElementById('hexName').textContent = hex.name + ' 卦';
  document.getElementById('hexMeaning').textContent = '「' + hex.m + '」';
  document.getElementById('hexDesc').textContent = hex.d;
  document.getElementById('hexAdvice').textContent = hex.a;

  // 显示卦象线条（从上往下：第6爻在上，第1爻在下）
  const linesArea = document.getElementById('linesArea');
  linesArea.innerHTML = '';
  for (let i = 5; i >= 0; i--) {
    const l = lines[i];
    const n = i + 1;
    const div = document.createElement('div');
    div.className = 'line-row' + (l.change ? ' changing' : '');
    div.innerHTML = '<span class="line-num">' + n + '爻</span>' +
      '<div class="line-bar ' + l.bar + '"></div>' +
      '<span class="line-desc">' + l.text + '</span>';
    linesArea.appendChild(div);
  }

  const noteEl = document.getElementById('changingNote');
  if (changed.length > 0) {
    const nums = [];
    for (let i = 0; i < lines.length; i++) if (lines[i].change) nums.push(i + 1);
    noteEl.innerHTML = '<strong>⚡ 本卦有 ' + changed.length + ' 个动爻</strong>（第 ' + nums.join('、') + ' 爻），' +
      '动爻为变化的关键点，由此产生变卦。本卦象征当前状态，变卦预示变化后的结果。';
  } else {
    noteEl.innerHTML = '<strong>☯ 本卦六爻安静无变</strong>，主卦象本身的意义。事物处于相对稳定阶段。';
  }
}

function reset() {
  document.getElementById('page-result').classList.remove('active');
  document.getElementById('page-tossing').classList.remove('active');
  document.getElementById('page-start').style.display = 'block';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('question').value = '';
  document.getElementById('tossText').textContent = '三枚铜钱，正在摇动...';
  document.getElementById('tossCount').textContent = '第 1 / 6 爻';
  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('[data-scene="事业"]').classList.add('selected');
  currentScene = '事业';
}
