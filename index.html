<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易道 - 易经人生指导</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#0a0a1a; color:#e8d5b0; min-height:100vh; overflow-x:hidden; }

.hero { text-align:center; padding:120px 20px 80px; position:relative; }
.hero::before { content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:400px; height:400px; background:radial-gradient(circle, rgba(201,168,76,0.1) 0%, transparent 70%); border-radius:50%; }

.bagua { font-size:120px; line-height:1; margin-bottom:30px; text-shadow:0 0 60px rgba(201,168,76,0.4); }
.title { font-size:64px; font-weight:bold; letter-spacing:12px; color:#c9a84c; text-shadow:0 0 40px rgba(201,168,76,0.3); margin-bottom:16px; }
.subtitle { font-size:22px; color:#8a7a5a; letter-spacing:6px; margin-bottom:60px; }

.tagline { font-size:18px; color:#a0906a; max-width:600px; margin:0 auto 60px; line-height:2; }

.cta { display:inline-block; padding:18px 50px; background:linear-gradient(135deg,#c9a84c,#8a6420); color:#0a0a1a; font-size:18px; font-weight:bold; text-decoration:none; border-radius:50px; letter-spacing:4px; transition:all 0.3s; box-shadow:0 4px 30px rgba(201,168,76,0.3); }
.cta:hover { transform:translateY(-3px); box-shadow:0 8px 40px rgba(201,168,76,0.5); }

.sections { display:flex; flex-wrap:wrap; justify-content:center; gap:30px; padding:0 20px 100px; max-width:1200px; margin:0 auto; }

.card { background:rgba(255,255,255,0.03); border:1px solid rgba(201,168,76,0.2); border-radius:20px; padding:50px 40px; width:260px; text-align:center; transition:all 0.3s; }
.card:hover { border-color:rgba(201,168,76,0.6); transform:translateY(-5px); box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.card-icon { font-size:56px; margin-bottom:24px; }
.card h3 { font-size:22px; color:#c9a84c; margin-bottom:14px; letter-spacing:2px; }
.card p { font-size:14px; color:#7a6a4a; line-height:1.9; }

.footer { text-align:center; padding:40px 20px; color:#4a3a2a; font-size:13px; border-top:1px solid rgba(201,168,76,0.1); }
.footer span { color:#c9a84c; }

.yin-yang { position:fixed; right:-80px; top:50%; transform:translateY(-50%); font-size:200px; opacity:0.03; pointer-events:none; }

.divider { width:60px; height:2px; background:linear-gradient(90deg,transparent,#c9a84c,transparent); margin:0 auto 30px; }

@media(max-width:768px){
  .title{font-size:40px; letter-spacing:6px;}
  .card{width:calc(100% - 40px);}
}
</style>
</head>
<body>

<div class="yin-yang">☯</div>

<section class="hero">
  <div class="bagua">☰</div>
  <div class="title">易道</div>
  <div class="subtitle">以易经智慧，指引人生方向</div>
  <div class="divider"></div>
  <p class="tagline">
    融合易经64卦、心理咨询、家庭教育、个人成长，<br>
    为你提供可落地的人生指导方案。<br>
    摇一卦，看清当下，洞见未来。
  </p>
  <a href="divination.html" class="cta">立即体验摇卦 ☯</a>
</section>

<section class="sections">
  <div class="card">
    <div class="card-icon">☰</div>
    <h3>易经占卜</h3>
    <p>模拟三枚铜钱摇卦，解读64卦象义，结合你的实际问题给予指导建议</p>
  </div>
  <div class="card">
    <div class="card-icon">🧠</div>
    <h3>心理咨询</h3>
    <p>以易经智慧为引，结合现代心理学，帮你理清情绪、找到内心答案</p>
  </div>
  <div class="card">
    <div class="card-icon">👨‍👩‍👧</div>
    <h3>家庭教育</h3>
    <p>用易经思维解读亲子关系、家庭能量场，提供实用的家庭教育方案</p>
  </div>
  <div class="card">
    <div class="card-icon">🌱</div>
    <h3>个人成长</h3>
    <p>借古人之智，修今人之道。陪你一起成长、觉醒、突破人生卡点</p>
  </div>
</section>

<footer class="footer">
  <p>© 2025 <span>易道 YIDAO</span> | Xinhui-631</p>
  <p style="margin-top:8px; color:#3a2a1a;">用智慧照亮人生 · 用文化温暖心灵</p>
</footer>

</body>
</html>
